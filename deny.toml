[advisories]
unmaintained = "all"
unsound = "all"

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    { crate = "hashbrown@0.16.1", reason = "Ratatui layout and cache dependencies currently resolve separate compatible releases" },
    { crate = "syn@2.0.119", reason = "Ratatui and Serde macro dependencies currently resolve separate major releases" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
